<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>SVG for source artwork, PNG for transparency, JPEG for flat backgrounds</title><rect width="1440" height="960" fill="#282722"/><text x="90" y="130" fill="#d5b584" font-family="Arial,sans-serif" font-size="36">CHOOSE A FILE FOR THE JOB</text><rect x="90" y="240" width="390" height="520" rx="8" fill="#f1eadc"/><text x="128" y="360" fill="#282722" font-family="Arial,sans-serif" font-size="72">SVG</text><path d="M128 410H440" stroke="#bdb4a2"/><text x="128" y="525" fill="#282722" font-family="Arial,sans-serif" font-size="28">Scalable source</text><text x="128" y="580" fill="#655e50" font-family="Arial,sans-serif" font-size="23">Website or print</text><rect x="525" y="240" width="390" height="520" rx="8" fill="#34332e"/><text x="563" y="360" fill="#f1eadc" font-family="Arial,sans-serif" font-size="72">PNG</text><path d="M563 410H875" stroke="#aaa18f"/><text x="563" y="525" fill="#f1eadc" font-family="Arial,sans-serif" font-size="28">Transparent pixels</text><text x="563" y="580" fill="#aaa18f" font-family="Arial,sans-serif" font-size="23">Overlays or slides</text><rect x="960" y="240" width="390" height="520" rx="8" fill="#34332e"/><text x="998" y="360" fill="#f1eadc" font-family="Arial,sans-serif" font-size="72">JPEG</text><path d="M998 410H1310" stroke="#aaa18f"/><text x="998" y="525" fill="#f1eadc" font-family="Arial,sans-serif" font-size="28">Flat background</text><text x="998" y="580" fill="#aaa18f" font-family="Arial,sans-serif" font-size="23">Photo compositions</text><text x="90" y="860" fill="#aaa18f" font-family="Arial,sans-serif" font-size="26">The downloadable original is SVG. Convert a copy when your app needs pixels.</text></svg>
