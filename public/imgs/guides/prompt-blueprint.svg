<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>A practical photo prompt has five parts</title><rect width="1440" height="960" fill="#282722"/><text x="90" y="125" fill="#d5b584" font-family="Arial,sans-serif" font-size="34">THE FIVE-PART PROMPT</text><path d="M90 205H1350" stroke="#aaa18f" opacity=".5"/><text x="95" y="260" fill="#d5b584" font-family="Arial,sans-serif" font-size="26">01</text><text x="190" y="260" fill="#f1eadc" font-family="Arial,sans-serif" font-size="29">SUBJECT</text><text x="510" y="260" fill="#aaa18f" font-family="Arial,sans-serif" font-size="27">Who or what is in the image?</text><path d="M90 328H1350" stroke="#aaa18f" opacity=".5"/><text x="95" y="383" fill="#d5b584" font-family="Arial,sans-serif" font-size="26">02</text><text x="190" y="383" fill="#f1eadc" font-family="Arial,sans-serif" font-size="29">KEEP</text><text x="510" y="383" fill="#aaa18f" font-family="Arial,sans-serif" font-size="27">Face, expression, hairstyle, proportions.</text><path d="M90 451H1350" stroke="#aaa18f" opacity=".5"/><text x="95" y="506" fill="#d5b584" font-family="Arial,sans-serif" font-size="26">03</text><text x="190" y="506" fill="#f1eadc" font-family="Arial,sans-serif" font-size="29">CHANGE</text><text x="510" y="506" fill="#aaa18f" font-family="Arial,sans-serif" font-size="27">One scene or outfit you want to try.</text><path d="M90 574H1350" stroke="#aaa18f" opacity=".5"/><text x="95" y="629" fill="#d5b584" font-family="Arial,sans-serif" font-size="26">04</text><text x="190" y="629" fill="#f1eadc" font-family="Arial,sans-serif" font-size="29">LIGHT</text><text x="510" y="629" fill="#aaa18f" font-family="Arial,sans-serif" font-size="27">Direction, softness and colour.</text><path d="M90 697H1350" stroke="#aaa18f" opacity=".5"/><text x="95" y="752" fill="#d5b584" font-family="Arial,sans-serif" font-size="26">05</text><text x="190" y="752" fill="#f1eadc" font-family="Arial,sans-serif" font-size="29">COMPOSE</text><text x="510" y="752" fill="#aaa18f" font-family="Arial,sans-serif" font-size="27">Framing, space and what to leave out.</text><text x="90" y="910" fill="#aaa18f" font-family="Arial,sans-serif" font-size="23">A clear description gives direction. It cannot guarantee an identical face.</text></svg>
