<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>Prepare a clear photo, describe one change, review and download</title><rect width="1440" height="960" fill="#282722"/><text x="90" y="130" fill="#d5b584" font-family="Arial,sans-serif" font-size="34">ONE PHOTO. ONE CLEAR DIRECTION.</text><text x="90" y="315" fill="#d5b584" font-family="Arial,sans-serif" font-size="100">01</text><path d="M90 370H455" stroke="#aaa18f"/><text x="90" y="460" fill="#f1eadc" font-family="Arial,sans-serif" font-size="33">PREPARE</text><text x="90" y="545" fill="#aaa18f" font-family="Arial,sans-serif" font-size="24">A sharp, well-lit photo</text><text x="90" y="585" fill="#aaa18f" font-family="Arial,sans-serif" font-size="24">with a visible subject.</text><text x="535" y="315" fill="#d5b584" font-family="Arial,sans-serif" font-size="100">02</text><path d="M535 370H900" stroke="#aaa18f"/><text x="535" y="460" fill="#f1eadc" font-family="Arial,sans-serif" font-size="33">DESCRIBE</text><text x="535" y="545" fill="#aaa18f" font-family="Arial,sans-serif" font-size="24">One scene, one light,</text><text x="535" y="585" fill="#aaa18f" font-family="Arial,sans-serif" font-size="24">a short keep list.</text><text x="980" y="315" fill="#d5b584" font-family="Arial,sans-serif" font-size="100">03</text><path d="M980 370H1345" stroke="#aaa18f"/><text x="980" y="460" fill="#f1eadc" font-family="Arial,sans-serif" font-size="33">REVIEW</text><text x="980" y="545" fill="#aaa18f" font-family="Arial,sans-serif" font-size="24">Face, hands, edges.</text><text x="980" y="585" fill="#aaa18f" font-family="Arial,sans-serif" font-size="24">Then save the result.</text><rect x="90" y="720" width="1260" height="100" fill="#f1eadc"/><text x="125" y="783" fill="#282722" font-family="Arial,sans-serif" font-size="30">Change one detail at a time. Keep your original photo.</text></svg>
